
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Donor Profile Handling</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        nav {
            background-color: #023e8a;
            display: flex;
            justify-content: center;
            padding: 10px 0;
        }
        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
            padding: 8px 16px;
            border-radius: 5px;
        }
        nav a:hover {
            background-color: #90e0ef;
            color: #023e8a;
        }
        h1, h2 {
            color: #4b0082;
        }
        form {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px #bbb;
            margin-bottom: 20px;
        }
        label, input, select, input[type="submit"], button {
            display: block;
            margin: 10px 0;
            width: 100%;
        }
        input[type="submit"], button {
            background-color: #4b0082;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #4b0082;
            color: white;
        }
        .action-buttons {
            display: flex;
            gap: 5px;
        }
        .btn {
            padding: 5px 10px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        .btn-edit {
            background-color: #4CAF50;
            color: white;
        }
        .btn-delete {
            background-color: #f44336;
            color: white;
        }
    </style>
</head>
<body>
<nav>
    <a th:href="@{/communications}">Donor Communication</a>
    <a th:href="@{/appointments}">Appointment Management</a>
    <a th:href="@{/coordination}">Coordination</a>
    <a th:href="@{/reports}">Reporting & Tracking</a>
    <a th:href="@{/dashboard}">Dashboard</a>
</nav>
    <h1>Donor Profile Handling</h1>
    
    <h2>Add New Donor</h2>
    <form th:action="@{/donors/save}" method="post">
        <label for="name">Donor Name:</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <label for="phone">Phone:</label>
        <input type="tel" id="phone" name="phone" required>

        <label for="address">Address:</label>
        <input type="text" id="address" name="address">

        <label for="bloodType">Blood Type:</label>
        <select id="bloodType" name="bloodType">
            <option value="">Select Blood Type</option>
            <option value="A+">A+</option>
            <option value="A-">A-</option>
            <option value="B+">B+</option>
            <option value="B-">B-</option>
            <option value="AB+">AB+</option>
            <option value="AB-">AB-</option>
            <option value="O+">O+</option>
            <option value="O-">O-</option>
        </select>

        <input type="submit" value="Add Donor">
    </form>

    <hr>
    <h2>Donor List</h2>
    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Address</th>
            <th>Blood Type</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="donor : ${donors}">
            <td th:text="${donor.id}">ID</td>
            <td th:text="${donor.name}">Name</td>
            <td th:text="${donor.email}">Email</td>
            <td th:text="${donor.phone}">Phone</td>
            <td th:text="${donor.address}">Address</td>
            <td th:text="${donor.bloodType}">Blood Type</td>
            <td>
                <div class="action-buttons">
                    <a th:href="@{/donors/edit/{id}(id=${donor.id})}" class="btn btn-edit">Edit</a>
                    <a th:href="@{/donors/delete/{id}(id=${donor.id})}" class="btn btn-delete" 
                       onclick="return confirm('Are you sure you want to delete this donor?')">Delete</a>
                </div>
            </td>
        </tr>
        </tbody>
    </table>
</body>
</html>
