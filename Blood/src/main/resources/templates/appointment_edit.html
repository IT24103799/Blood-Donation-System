<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Appointment</title>
    <style>
        body {
            font-family: Verdana, sans-serif;
            background-color: #fffaf0;
            padding: 20px;
        }
        h1 {
            color: #8b4513;
        }
        form {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ddd;
            max-width: 500px;
            margin: 0 auto;
        }
        label, input, input[type="submit"] {
            display: block;
            margin: 10px 0;
            width: 100%;
        }
        input[type="submit"] {
            background-color: #8b4513;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #8b4513;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <a href="/appointments" class="back-link">← Back to Appointments</a>
    <h1>Edit Appointment</h1>

    <form th:action="@{/appointments/update}" method="post">
        <input type="hidden" th:name="id" th:value="${appointment.id}">
        
        <label for="donorName">Donor Name:</label>
        <input type="text" id="donorName" name="donorName" th:value="${appointment.donorName}" required>

        <label for="date">Date:</label>
        <input type="date" id="date" name="date" th:value="${appointment.date}" required>

        <label for="time">Time:</label>
        <input type="time" id="time" name="time" th:value="${appointment.time}" required>

        <input type="submit" value="Update Appointment">
    </form>
</body>
</html>
