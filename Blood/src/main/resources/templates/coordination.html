
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Coordination</title>
    <style>
        body {
            font-family: Georgia, serif;
            background-color: #e6f2ff;
            padding: 20px;
        }
        h1, h2 {
            color: #006699;
        }
        form {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px #aaa;
            margin-bottom: 20px;
        }
        label, select, textarea, input[type="submit"] {
            display: block;
            margin: 10px 0;
            width: 100%;
        }
        input[type="submit"] {
            background-color: #006699;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #006699;
            color: white;
        }
        .btn {
            padding: 5px 10px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            background-color: #f44336;
            color: white;
        }
    </style>
</head>
<body>
    <h1>Coordination</h1>
    
    <h2>Send Information</h2>
    <form th:action="@{/coordination/send}" method="post">
        <label for="recipient">Send To:</label>
        <select id="recipient" name="recipient" required>
            <option value="">Select recipient</option>
            <option value="Nurse">Nurse</option>
            <option value="Doctor">Doctor</option>
            <option value="Blood Bank Manager">Blood Bank Manager</option>
            <option value="IT Technician">IT Technician</option>
        </select>

        <label for="information">Information:</label>
        <textarea id="information" name="information" rows="4" placeholder="Type the information to send..." required></textarea>

        <input type="submit" value="Send">
    </form>

    <hr>
    <h2>Coordination History</h2>
    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Recipient</th>
            <th>Information</th>
            <th>Status</th>
            <th>Priority</th>
            <th>Date</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="coordination : ${coordinations}">
            <td th:text="${coordination.id}">ID</td>
            <td th:text="${coordination.recipient}">Recipient</td>
            <td th:text="${coordination.information}">Information</td>
            <td th:text="${coordination.status}">Status</td>
            <td th:text="${coordination.priority}">Priority</td>
            <td th:text="${#temporals.format(coordination.createdAt, 'yyyy-MM-dd HH:mm')}">Date</td>
            <td>
                <a th:href="@{/coordination/delete/{id}(id=${coordination.id})}" class="btn" 
                   onclick="return confirm('Are you sure you want to delete this coordination?')">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>
</body>
</html>
